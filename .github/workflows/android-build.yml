name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 运行系统
    runs-on: ubuntu-latest

    steps:
      # 签出代码
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      # 配置 jdk
      - name: Setup Java JDK
        uses: actions/setup-java@v5.0.0
        with:
          java-version: 17
          distribution: temurin

      # 配置 gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 授权
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # 构建 签名apk
      - name: Build APK
        run: |
          ./gradlew :app:assembleDbeug


      # 上次 签名apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: App-unsign.apk
          path: ./app/build/outputs/apk/release/*.apk
          retention-days: 1
